# Smoke test: every tab and main screen of both roles renders without crashing.
appId: com.kirimin.app
name: 01 Smoke – all tabs render
tags: [smoke]
---
- runScript:
    file: ../scripts/api.js
    env:
      ACTION: preflight

# ── Kirim (sender) ─────────────────────────────────────────────
- runFlow:
    file: ../subflows/login_as.yaml
    env:
      DEMO_BUTTON: "Wayan"
      HOME_TEXT: "Mau kirim ke mana\\?"
- tapOn: "Aktivitas"
- assertVisible: "Berjalan"
- tapOn: "Selesai"
- tapOn: "Notifikasi"
- tapOn: "Profil"
- assertVisible: "Ganti ke pengemudi"
- tapOn: "Beranda"
- tapOn: "Cari tujuan pengiriman"
- assertVisible: "Kirim paket"          # step 1 (Rute) opens
- back

# ── Switch role → Angkut (driver) ──────────────────────────────
- tapOn: "Profil"
- tapOn: "Ganti ke pengemudi"
- extendedWaitUntil:
    visible: "Halo, Made"
    timeout: 10000
- tapOn: "Rute Saya"
- tapOn: "Kiriman"
- tapOn: "Profil"
- tapOn: "Beranda"
- tapOn:
    id: "buat-rute-cta"
- assertNotVisible: ".*[Ee]rror.*"      # D1 opens without a red error screen
- back
