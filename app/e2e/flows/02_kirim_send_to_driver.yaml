# S1 → S5: Wayan sends a document to Made, who is already driving Renon → Kampus Bukit.
appId: com.kirimin.app
name: 02 Kirim – send a package to a driver searah
tags: [mvp]
---
- runScript:
    file: ../scripts/api.js
    env:
      ACTION: preflight
- runFlow:
    file: ../subflows/login_as.yaml
    env:
      DEMO_BUTTON: "Wayan"
      HOME_TEXT: "Mau kirim ke mana\\?"

# Step 1 Rute — defaults are Renon → Kampus Bukit; the recipient is typed in
- tapOn: "Cari tujuan pengiriman"
- assertVisible: "Kirim paket"
- extendedWaitUntil:                   # price estimate from POST /matches/estimate
    visible: ".*Rp.*"
    timeout: 10000
- tapOn: "Contoh: Dewa"
- inputText: "Raka"
- tapOn: "Contoh: 081234567890"
- inputText: "081288887777"
- hideKeyboard
- tapOn: "Lanjut ke detail paket"

# Step 2 Paket — defaults are Dokumen / XS / < 1 kg
- assertVisible: "Paketnya apa\\?"
- tapOn: "Cari pengemudi searah"

# Step 3 Driver — Made must be offered on the direct route
- extendedWaitUntil:
    visible: "Made S\\."
    timeout: 10000
- assertVisible: "Searah"
- tapOn:
    text: "Pilih"
    below: "Made S\\."

# Step 4 Cek lalu kirim — driver, price, then send
- assertVisible: "Cek lalu kirim"
- assertVisible: "Made S\\."
- tapOn: "Kirim ke Made"

# Tracking — waiting for Made, and the 4-digit code is shown to the sender
- extendedWaitUntil:
    visible: "Pesanan KRM-.*"
    timeout: 10000
- assertVisible: "Menunggu konfirmasi driver"
- assertVisible:
    id: "handover-code-display"
- takeScreenshot: e2e-02-lacak
