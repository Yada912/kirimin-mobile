# S3 → S6 → S7: post an open request (no driver chosen), then cancel it.
appId: com.kirimin.app
name: 05 Kirim – open request, then cancel
tags: [mvp]
---
- runFlow:
    file: ../subflows/login_as.yaml
    env:
      DEMO_BUTTON: "Wayan \\(pengirim\\)"
      HOME_TEXT: "Mau kirim ke mana\\?"
- tapOn: "Cari tujuan pengiriman"
- tapOn: "Contoh: Dewa"
- inputText: "Raka"
- tapOn: "Contoh: 081234567890"
- inputText: "081288887777"
- hideKeyboard
- tapOn: "Lanjut ke detail paket"
- tapOn: "Cari pengemudi searah"
- scrollUntilVisible:
    element: "Kirim ke semua pengemudi"
- tapOn: "Kirim ke semua pengemudi"

# S4 for an open request: no fake price
- assertVisible: "Cek lalu kirim"
- assertVisible: "Ongkos muncul setelah.*"
- tapOn: "Kirim ke semua pengemudi"

# S6 Menunggu Driver → S7 Batalkan
- extendedWaitUntil:
    visible: "Menunggu pengemudi"
    timeout: 10000
- tapOn: "Batalkan"
- assertVisible: "Batalkan pesanan ini\\?"
- scrollUntilVisible:
    element: "Ya, batalkan"
- tapOn: "Ya, batalkan"
- extendedWaitUntil:
    visible: "Berjalan"
    timeout: 10000
