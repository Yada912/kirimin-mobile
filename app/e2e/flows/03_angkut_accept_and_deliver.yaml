# D3 → D5 → X2: Made accepts Wayan's request, picks it up and hands it over with the code.
# Needs flow 02 to have run first.
appId: com.kirimin.app
name: 03 Angkut – accept, pick up, deliver with code
tags: [mvp]
---
- runFlow:
    file: ../subflows/login_as.yaml
    env:
      DEMO_BUTTON: "Made \\(pengemudi\\)"
      HOME_TEXT: "Halo, Made"

# Beranda → active route card → D3 Permintaan Masuk
- tapOn: "Lihat permintaan"
- extendedWaitUntil:
    visible: "Terima"
    timeout: 10000
- tapOn:
    text: "Terima"
    index: 0                   # requests sent to this route are listed before open ones

# "Mulai perjalanan (n paket)" appears once a slot is used
- extendedWaitUntil:
    visible: "Mulai perjalanan \\(.*"
    timeout: 10000
- tapOn: "Mulai perjalanan \\(.*"

# D5 Perjalanan Aktif
- tapOn: "Mulai perjalanan"
- extendedWaitUntil:
    visible: "Paket sudah dijemput"
    timeout: 10000
- tapOn: "Paket sudah dijemput"
- extendedWaitUntil:
    visible: "Saya sudah sampai"
    timeout: 10000
- tapOn: "Saya sudah sampai"
- extendedWaitUntil:
    visible: "Masukkan kode penerima"
    timeout: 10000
- tapOn: "Masukkan kode penerima"

# X2 Serah Terima — wrong code first (must show an error, not crash), then the real one
- assertVisible: "Serahkan paket"
- runScript:
    file: ../scripts/api.js
    env:
      ACTION: handoverCode
- tapOn:
    id: "handover-code"
- inputText: "${output.code == '0000' ? '1111' : '0000'}"
- hideKeyboard
- tapOn: "Selesai, paket diserahkan"
- assertVisible: "Kode serah terima salah"   # the server’s message, shown as-is
- assertNotVisible: "Paket sudah diserahkan"
- tapOn:
    id: "handover-code"
- eraseText: 4
- inputText: "${output.code}"
- hideKeyboard
- tapOn: "Selesai, paket diserahkan"
- extendedWaitUntil:
    visible: "Paket sudah diserahkan"
    timeout: 10000
- takeScreenshot: e2e-03-delivered

# Back to the trip and finish it
- tapOn: "Kembali ke perjalanan"
- scrollUntilVisible:
    element: "Selesaikan perjalanan"
- tapOn: "Selesaikan perjalanan"
- extendedWaitUntil:
    visible: "Rute Saya"
    timeout: 10000
