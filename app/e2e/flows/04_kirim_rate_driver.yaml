# S5 → X3: Wayan sees the delivered order in history and rates Made. Needs 02 and 03 first.
appId: com.kirimin.app
name: 04 Kirim – see delivery and rate the driver
tags: [mvp]
---
- runFlow:
    file: ../subflows/login_as.yaml
    env:
      DEMO_BUTTON: "Masuk: Wayan.*"
      HOME_TEXT: "Kirim Paket Sekarang"
- tapOn: "Aktivitas"
- tapOn: "Riwayat Selesai"
- extendedWaitUntil:
    visible: "Selesai"
    timeout: 10000
- tapOn:
    text: "Selesai"
    index: 0                  # newest delivered order
- extendedWaitUntil:
    visible: "Lacak Pesanan"
    timeout: 10000
- assertNotVisible:           # code is hidden once delivered
    id: "handover-code-display"
- scrollUntilVisible:
    element: "Beri Rating Driver.*"
- tapOn: "Beri Rating Driver.*"
- assertVisible: "Beri Penilaian.*"
- tapOn: "Kirim Penilaian"
- extendedWaitUntil:
    visible: "Sedang Berjalan"   # back on Aktivitas
    timeout: 10000
