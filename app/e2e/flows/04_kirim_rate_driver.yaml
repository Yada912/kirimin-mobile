# S5 → X3: Wayan sees the delivered order in history and rates Made. Needs 02 and 03 first.
appId: com.kirimin.app
name: 04 Kirim – see delivery and rate the driver
tags: [mvp]
---
- runFlow:
    file: ../subflows/login_as.yaml
    env:
      DEMO_BUTTON: "Wayan"
      HOME_TEXT: "Mau kirim ke mana\\?"
- tapOn: "Aktivitas"
- tapOn: "Selesai"
- extendedWaitUntil:
    visible: "Selesai"
    timeout: 10000
- tapOn:
    text: "Selesai"
    index: 1                  # index 0 is the "Selesai" tab; 1 = newest delivered order
- extendedWaitUntil:
    visible: "Pesanan KRM-.*"
    timeout: 10000
- assertNotVisible:           # code is hidden once delivered
    id: "handover-code-display"
- scrollUntilVisible:
    element: "Beri nilai pengemudi"
- tapOn: "Beri nilai pengemudi"
- assertVisible: "Beri nilai"
- tapOn: "Kirim nilai"
- extendedWaitUntil:
    visible: "Berjalan"   # back on Aktivitas
    timeout: 10000
