# Logs in with one of the "Coba pakai akun contoh" buttons on the Masuk screen.
# env: DEMO_BUTTON  text of the demo button, e.g. "Wayan \\(pengirim\\)"
#      HOME_TEXT    something only that role's home shows
appId: com.kirimin.app
---
- launchApp:
    clearState: true          # wipes the saved login token
- extendedWaitUntil:          # first launch of a debug build downloads the JS bundle
    visible: "Saya sudah punya akun"
    timeout: 60000
- tapOn: "Saya sudah punya akun"
- extendedWaitUntil:
    visible: "Coba pakai akun contoh.*"
    timeout: 10000
- tapOn: "${DEMO_BUTTON}"
- extendedWaitUntil:
    visible: "${HOME_TEXT}"
    timeout: 15000
