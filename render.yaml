# Render Blueprint (optional, for later): Dashboard → New → Blueprint → pick this repo.
# Free web services sleep after 15 min idle and have a temporary disk, so data lives in
# Turso and photos in Cloudinary. Fill in the three `sync: false` values in the dashboard
# when Render asks (see docs/HOSTING.md). Without them the server falls back to a local
# SQLite file and local photos, which are wiped on every restart.
services:
  - type: web
    name: kirimin-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: echo "No build step needed"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_EMPTY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
